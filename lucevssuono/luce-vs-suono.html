<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Luce contro suono</title>
<style>
:root{
  --bg:#ffffff;--text:#1f2328;--text-secondary:#57606a;--text-muted:#8c959f;
  --surface-1:#f3f4f6;--border:#d0d7de;--radius:10px;
  --bg-accent:#e6f1fb;--text-accent:#185fa5;--bg-warning:#faeeda;--bg-success:#e1f5ee;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#1b1c1f;--text:#e8e8ea;--text-secondary:#a0a4ab;--text-muted:#7d8189;
    --surface-1:#2a2c31;--border:#3d4047;
    --bg-accent:#0c447c;--text-accent:#b5d4f4;--bg-warning:#633806;--bg-success:#085041;
  }
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.4;}
.app{max-width:460px;margin:0 auto;padding:20px 16px 32px;}
h1{font-size:22px;font-weight:600;margin:0 0 14px;}
button{font:inherit;color:inherit;background:transparent;border:1px solid var(--border);border-radius:var(--radius);padding:10px 8px;cursor:pointer;}
button:hover{background:var(--surface-1);}
button:focus-visible,#clockCard:focus-visible{outline:2px solid var(--text-accent);outline-offset:2px;}
input[type=range]{accent-color:var(--text-accent);}
svg.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;}
</style>
</head>
<body>
<div class="app">
<h1>Luce contro suono</h1>
<div style="padding:0 0 1rem;">
  <div id="distOut" style="font-size:20px;font-weight:500;margin:0 0 10px;">Fulmine — 1 km</div>
  <div style="display:flex;align-items:center;gap:12px;margin:0 0 10px;">
    <label for="dist" style="font-size:14px;color:var(--text-secondary);min-width:78px;">Distanza</label>
    <input type="range" id="dist" min="1" max="7.3" step="0.01" value="3" style="flex:1;">
  </div>
  <div style="display:flex;align-items:center;gap:12px;margin:0 0 4px;">
    <label for="temp" style="font-size:14px;color:var(--text-secondary);min-width:78px;">Temperatura</label>
    <input type="range" id="temp" min="-20" max="40" step="1" value="20" style="flex:1;">
    <span id="tempOut" style="font-size:14px;font-weight:500;min-width:48px;text-align:right;">20 °C</span>
  </div>
  <div id="vOut" style="font-size:13px;color:var(--text-secondary);margin:0 0 12px;"></div>
  <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:0 0 1.25rem;">
    <button data-p="2.477" data-n="Cannone" data-d="Colpo di cannone a 300 m: vedi la fiammata prima di sentire il colpo.">Cannone, 300 m</button>
    <button data-p="2.903" data-n="Fuochi d'artificio" data-d="Fuochi d'artificio a 800 m: lo scoppio arriva in ritardo rispetto ai colori.">Fuochi, 800 m</button>
    <button data-p="3" data-n="Fulmine" data-d="Fulmine a 1 km: conta i secondi tra lampo e tuono.">Fulmine, 1 km</button>
    <button data-p="4" data-n="Temporale" data-d="Temporale a 10 km: il tuono arriva quasi mezzo minuto dopo il lampo.">Temporale, 10 km</button>
    <button data-p="4.477" data-n="Eruzione" data-d="Eruzione vulcanica a 30 km: il boato arriva dopo circa un minuto e mezzo.">Eruzione, 30 km</button>
    <button data-p="6.681" data-n="Krakatoa 1883" data-d="Krakatoa, 1883: l'esplosione fu udita a circa 4.800 km di distanza, ore dopo.">Krakatoa, 4.800 km</button>
  </div>

  <div style="margin:0 0 14px;">
    <div style="display:flex;justify-content:space-between;font-size:13px;margin:0 0 4px;">
      <span style="color:var(--text-secondary);">Luce</span><span id="lp" style="font-weight:500;">0%</span>
    </div>
    <div style="display:flex;align-items:center;gap:8px;">
      <svg class="ic" viewBox="0 0 24 24" style="color:#EF9F27;" aria-hidden="true"><path d="M13 3l0 7l6 0l-8 11l0 -7l-6 0l8 -11"/></svg>
      <div style="flex:1;position:relative;height:14px;border-radius:7px;background:var(--surface-1);">
        <div id="lbar" style="position:absolute;left:0;top:0;height:14px;border-radius:7px;background:#EF9F27;opacity:0.35;width:0;"></div>
        <div id="ldot" style="position:absolute;top:0;left:0;width:14px;height:14px;border-radius:50%;background:#EF9F27;"></div>
      </div>
      <svg id="eye" class="ic" viewBox="0 0 24 24" style="color:var(--text-secondary);transition:transform 0.25s,color 0.25s;" aria-hidden="true"><path d="M10 12a2 2 0 1 0 4 0a2 2 0 0 0 -4 0"/><path d="M21 12c-2.4 4 -5.4 6 -9 6c-3.6 0 -6.6 -2 -9 -6c2.4 -4 5.4 -6 9 -6c3.6 0 6.6 2 9 6"/></svg>
    </div>
  </div>

  <div style="margin:0 0 1.25rem;">
    <div style="display:flex;justify-content:space-between;font-size:13px;margin:0 0 4px;">
      <span style="color:var(--text-secondary);">Suono</span><span id="sp" style="font-weight:500;">0%</span>
    </div>
    <div style="display:flex;align-items:center;gap:8px;">
      <svg class="ic" viewBox="0 0 24 24" style="color:#1D9E75;" aria-hidden="true"><path d="M15 8a5 5 0 0 1 0 8"/><path d="M6 15h-2a1 1 0 0 1 -1 -1v-4a1 1 0 0 1 1 -1h2l3.5 -4.5a.8 .8 0 0 1 1.5 .5v14a.8 .8 0 0 1 -1.5 .5l-3.5 -4.5"/></svg>
      <div style="flex:1;position:relative;height:14px;border-radius:7px;background:var(--surface-1);">
        <div id="sbar" style="position:absolute;left:0;top:0;height:14px;border-radius:7px;background:#1D9E75;opacity:0.35;width:0;"></div>
        <div id="sdot" style="position:absolute;top:0;left:0;width:14px;height:14px;border-radius:50%;background:#1D9E75;"></div>
      </div>
      <svg id="ear" class="ic" viewBox="0 0 24 24" style="color:var(--text-secondary);transition:transform 0.25s,color 0.25s;" aria-hidden="true"><path d="M6 10a6 6 0 1 1 12 0c0 3 -2 4 -2.5 6.5a3.5 3.5 0 0 1 -6.5 1"/><path d="M10 10a2 2 0 1 1 4 0c0 1 -1 1.5 -1.5 2.5"/></svg>
    </div>
  </div>

  <div id="clockCard" role="button" tabindex="0" aria-label="Tempo trascorso, tocca per cambiare la velocità della simulazione" style="background:var(--surface-1);border-radius:var(--radius);padding:12px 16px;margin:0 0 12px;cursor:pointer;transition:background 0.2s;user-select:none;">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;">
      <span style="font-size:13px;color:var(--text-secondary);">Tempo trascorso</span>
      <span id="mode" style="font-size:12px;font-weight:500;padding:3px 10px;border-radius:var(--radius);background:var(--bg-accent);color:var(--text-accent);"></span>
    </div>
    <div id="clock" style="font-size:24px;font-weight:500;">0 ns</div>
    <div style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-muted);margin-top:2px;">
      <svg class="ic" viewBox="0 0 24 24" style="width:14px;height:14px;" aria-hidden="true"><path d="M5 3l5 16l2.5 -6.5l6.5 -2.5z"/></svg>
      <span id="sub"></span>
    </div>
  </div>

  <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:0 0 1rem;">
    <div style="background:var(--surface-1);border-radius:var(--radius);padding:12px 16px;">
      <div style="font-size:13px;color:var(--text-secondary);">La luce arriva in</div>
      <div id="tl" style="font-size:18px;font-weight:500;">–</div>
    </div>
    <div style="background:var(--surface-1);border-radius:var(--radius);padding:12px 16px;">
      <div style="font-size:13px;color:var(--text-secondary);">Il suono arriva in</div>
      <div id="ts" style="font-size:18px;font-weight:500;">–</div>
    </div>
  </div>

  <button id="go" style="width:100%;height:44px;font-weight:500;">Avvia simulazione</button>
  <p id="status" style="font-size:14px;color:var(--text-secondary);line-height:1.5;margin:12px 0 0;min-height:63px;"></p>
</div>
</div>
<script>
var C=299792458,V=343.4;
var sl=document.getElementById('dist'),tp=document.getElementById('temp'),go=document.getElementById('go');
var eye=document.getElementById('eye'),ear=document.getElementById('ear');
var card=document.getElementById('clockCard'),st=document.getElementById('status');
var modeEl=document.getElementById('mode'),sub=document.getElementById('sub');
var state=0,t=0,last=0,raf=0,tL=0,tS=0,flashed=false,modes=[],mi=0;
var curName='Fulmine',curDesc='Fulmine a 1 km: conta i secondi tra lampo e tuono.';
function nf(v,d){return v.toLocaleString('it-IT',{maximumFractionDigits:d});}
function dg(v){return v<10?2:(v<100?1:0);}
function fmt(s){
  if(s<1e-6){var n=s*1e9;return nf(n,dg(n))+' ns';}
  if(s<1e-3){var u=s*1e6;return nf(u,dg(u))+' µs';}
  if(s<1){var m=s*1e3;return nf(m,dg(m))+' ms';}
  if(s<60)return nf(s,dg(s))+' s';
  if(s<3600){var mi2=s/60;return nf(mi2,dg(mi2))+' min';}
  if(s<86400){var h=s/3600;return nf(h,dg(h))+' ore';}
  return nf(s/86400,1)+' giorni';
}
function fmtD(m){
  if(m<1000)return nf(m,0)+' m';
  var km=m/1000;
  return nf(km,km<100?1:0)+' km';
}
function pct(p){var v=p*100;if(v<0.001)return '≈ 0%';return nf(v,v<1?3:1)+'%';}
function place(id,bar,p){
  document.getElementById(id).style.left='calc('+(p*100)+'% - '+(p*14)+'px)';
  document.getElementById(bar).style.width='calc('+(p*100)+'% - '+(p*14)+'px + 14px)';
}
function render(tt,lp,sp){
  place('ldot','lbar',lp);place('sdot','sbar',sp);
  document.getElementById('lp').textContent=pct(lp);
  document.getElementById('sp').textContent=pct(sp);
  document.getElementById('clock').textContent=fmt(tt);
}
function pulse(el,color){
  el.style.color=color;el.style.transform='scale(1.6)';
  setTimeout(function(){el.style.transform='scale(1)';},300);
}
function flashCard(v){
  card.style.background=v;
  setTimeout(function(){card.style.background='var(--surface-1)';},250);
}
function buildModes(){
  var sm=Math.pow(10,Math.round(Math.log10(tL/3)));
  modes=[{n:'slow motion',s:sm},{n:'tempo reale',s:1}];
  if(tS>=20){modes.push({n:'time-lapse',s:Math.pow(10,Math.max(1,Math.round(Math.log10(tS/4))))});}
}
function showMode(){
  var m=modes[mi];
  modeEl.textContent=m.n+' ×'+nf(m.s,m.s<1?8:0);
  sub.textContent='1 s reale = '+fmt(m.s)+' simulato · tocca per cambiare';
}
function updateStatus(){
  var s;
  if(state===0){s=(curDesc||'Distanza personalizzata.')+' Avvia, poi tocca il riquadro del tempo per cambiare velocità.';}
  else if(state===3){s='Boom! Il suono è arrivato dopo '+fmt(tS)+', cioè '+fmt(tS-tL)+' dopo il flash. È '+nf(tS/tL,0)+' volte più lento della luce.';}
  else{
    s=flashed?'Flash! La luce è arrivata dopo '+fmt(tL)+'. Il suono è ancora in viaggio…':'La luce è in viaggio…';
    if(state===2)s='In pausa. '+s;
  }
  st.textContent=s;
}
function reset(keep){
  cancelAnimationFrame(raf);
  state=0;t=0;last=0;flashed=false;
  var T=+tp.value;
  V=331.3+0.606*T;
  document.getElementById('tempOut').textContent=nf(T,0)+' °C';
  document.getElementById('vOut').textContent='Velocità del suono: '+nf(V,1)+' m/s ('+nf(V*3.6,0)+' km/h)';
  var d=Math.pow(10,+sl.value);tL=d/C;tS=d/V;
  buildModes();
  if(!keep||mi>=modes.length)mi=0;
  document.getElementById('distOut').textContent=(curName?curName+' — ':'')+fmtD(d);
  document.getElementById('tl').textContent=fmt(tL);
  document.getElementById('ts').textContent=fmt(tS);
  render(0,0,0);showMode();
  eye.style.color='var(--text-secondary)';ear.style.color='var(--text-secondary)';
  card.style.background='var(--surface-1)';
  go.textContent='Avvia simulazione';
  updateStatus();
}
function loop(ts){
  if(state!==1)return;
  if(!last)last=ts;
  var dt=Math.min((ts-last)/1000,0.1);last=ts;
  t=Math.min(t+dt*modes[mi].s,tS);
  render(t,Math.min(t/tL,1),t/tS);
  if(!flashed&&t>=tL){
    flashed=true;pulse(eye,'#EF9F27');flashCard('var(--bg-warning)');updateStatus();
  }
  if(t>=tS){
    state=3;pulse(ear,'#1D9E75');flashCard('var(--bg-success)');
    go.textContent='Ricomincia';updateStatus();return;
  }
  raf=requestAnimationFrame(loop);
}
function run(){
  state=1;last=0;go.textContent='Pausa';updateStatus();
  raf=requestAnimationFrame(loop);
}
go.addEventListener('click',function(){
  if(state===0){run();}
  else if(state===1){state=2;cancelAnimationFrame(raf);go.textContent='Riprendi';updateStatus();}
  else if(state===2){run();}
  else if(state===3){reset(true);run();}
});
function cycle(){mi=(mi+1)%modes.length;showMode();last=0;}
card.addEventListener('click',cycle);
card.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();cycle();}});
sl.addEventListener('input',function(){curName='';curDesc='';reset(false);});
tp.addEventListener('input',function(){reset(false);});
document.querySelectorAll('button[data-p]').forEach(function(b){
  b.addEventListener('click',function(){
    sl.value=b.getAttribute('data-p');
    curName=b.getAttribute('data-n');curDesc=b.getAttribute('data-d');
    reset(false);
  });
});
reset(false);
</script>
</body>
</html>
